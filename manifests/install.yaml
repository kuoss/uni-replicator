apiVersion: v1
kind: Namespace
metadata:
  name: uni-replicator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uni-replicator
  namespace: uni-replicator
---
# Arbitrary resources require wildcard RBAC. Scope access more narrowly if the
# configured resource set is known and stable in your cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uni-replicator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uni-replicator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: uni-replicator
subjects:
  - kind: ServiceAccount
    name: uni-replicator
    namespace: uni-replicator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uni-replicator
  namespace: uni-replicator
data:
  config.yaml: |
    behavior:
      cascadeDeletionPolicy: Delete
    watches:
      - apiVersion: v1
        resources:
          - secrets
      # Uncomment when the NGINX Policy CRD is installed.
      # - apiVersion: k8s.nginx.org/v1
      #   resources:
      #     - policies
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-replicator
  namespace: uni-replicator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uni-replicator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-replicator
    spec:
      serviceAccountName: uni-replicator
      containers:
        - name: controller
          image: ghcr.io/kuoss/uni-replicator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/uni-replicator/config.yaml
            - --workers=2
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 80m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/uni-replicator
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: uni-replicator
