name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "tag must be a semantic version prefixed with v" >&2
            exit 1
          fi
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/uni-replicator" >> "$GITHUB_OUTPUT"
          echo "chart_registry=oci://ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/uni-replicator

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for image publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR for chart publishing
        shell: bash
        env:
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$HELM_PASSWORD" | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Package and publish Helm chart
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHART_REGISTRY: ${{ steps.release.outputs.chart_registry }}
        run: |
          helm package charts/uni-replicator --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/uni-replicator-$VERSION.tgz" "$CHART_REGISTRY"
